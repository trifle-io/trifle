version: "3.7"
name: "trifle"
services:
  redis:
    image: redis:latest
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
      MINIO_REGION_NAME: us-east-1
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - trifle_minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio miniosecret; do sleep 1; done &&
      mc mb --ignore-existing local/trifle-sqlite-files &&
      mc mb --ignore-existing local/trifle-traces
      "
  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - 27017:27017
    expose:
      - 27017
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: trifle_dev
    restart: unless-stopped
  app:
    command: /bin/sh -c "while sleep 1000; do :; done"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    build:
      context: .
      dockerfile: .devops/docker/local/Dockerfile
    depends_on:
      - redis
      - minio
      - minio-init
      - mongo
      - postgres
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ELIXIR_ERL_OPTIONS: "+fnu"
      PGHOST: postgres
      PGUSER: postgres
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      TRIFLE_TRACES_STORAGE_BACKEND: ${TRIFLE_TRACES_STORAGE_BACKEND:-s3}
      TRIFLE_TRACES_STORAGE_PATH: ${TRIFLE_TRACES_STORAGE_PATH:-}
      TRIFLE_TRACES_S3_ENDPOINT: ${TRIFLE_TRACES_S3_ENDPOINT:-http://minio:9000}
      TRIFLE_TRACES_S3_BUCKETS: ${TRIFLE_TRACES_S3_BUCKETS:-trifle-traces}
      TRIFLE_TRACES_S3_REGION: ${TRIFLE_TRACES_S3_REGION:-us-east-1}
      TRIFLE_TRACES_S3_ACCESS_KEY_ID: ${TRIFLE_TRACES_S3_ACCESS_KEY_ID:-minio}
      TRIFLE_TRACES_S3_SECRET_ACCESS_KEY: ${TRIFLE_TRACES_S3_SECRET_ACCESS_KEY:-miniosecret}
      TRIFLE_TRACES_S3_PREFIX: ${TRIFLE_TRACES_S3_PREFIX:-traces}
      TRIFLE_TRACES_RETENTION_DAYS: ${TRIFLE_TRACES_RETENTION_DAYS:-7}
      TRIFLE_TRACES_GZIP: ${TRIFLE_TRACES_GZIP:-true}
    ports:
      - 4000:4000
    volumes:
      - .:/workspaces/trifle:cached
      - trifle_deps:/workspaces/trifle/deps
      - trifle_build:/workspaces/trifle/_build
      - ../trifle_stats:/workspaces/trifle_stats
      - ../trifle_traces:/workspaces/trifle_traces
    working_dir: /workspaces/trifle
volumes:
  trifle_deps:
  trifle_build:
  trifle_minio_data:
