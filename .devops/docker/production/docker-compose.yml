version: "3.8"

# Required variables (compose refuses to start without them; there are no default
# passwords):
#   POSTGRES_PASSWORD, MONGO_PASSWORD, REDIS_PASSWORD, SECRET_KEY_BASE,
#   TRIFLE_DB_ENCRYPTION_KEY
#
# The data stores are reachable only on the compose network. To inspect one from
# the host, use `docker compose exec`, or add a port mapping bound to loopback in
# an override file, e.g. "127.0.0.1:5432:5432". Never publish them on 0.0.0.0.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trifle_prod
      POSTGRES_USER: trifle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trifle -d trifle_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: trifle
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build:
      context: ../../..
      dockerfile: .devops/docker/production/Dockerfile
    restart: unless-stopped
    environment:
      # Database configuration
      DATABASE_URL: "postgresql://trifle:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/trifle_prod"
      
      # MongoDB configuration
      MONGODB_URL: "mongodb://trifle:${MONGO_PASSWORD:?set MONGO_PASSWORD}@mongodb:27017/trifle_metrics"
      
      # Redis configuration
      REDIS_URL: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379"
      
      # Application configuration
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      TRIFLE_DB_ENCRYPTION_KEY: ${TRIFLE_DB_ENCRYPTION_KEY:?set TRIFLE_DB_ENCRYPTION_KEY}

      # Set to "true" when the app is served through a TLS-terminating proxy:
      # redirects HTTP to HTTPS, sends HSTS and marks cookies Secure.
      FORCE_SSL: ${FORCE_SSL:-false}
      # Header your proxy sets with the client address (e.g. x-forwarded-for), so
      # rate limits apply per visitor instead of per proxy.
      RATE_LIMIT_CLIENT_IP_HEADER: ${RATE_LIMIT_CLIENT_IP_HEADER:-}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: 4000
      MIX_ENV: prod
      PHX_SERVER: "true"
      
      # Pool configuration
      POOL_SIZE: ${POOL_SIZE:-10}
      
      # Timezone
      TZ: ${TZ:-UTC}

      # Internal Oban tracing and Stats metrics (does not affect user sources)
      TRIFLE_OBSERVABILITY_ENABLED: ${TRIFLE_OBSERVABILITY_ENABLED:-true}

      # Internal trace payloads: none, file, or S3-compatible storage
      TRIFLE_TRACES_STORAGE_BACKEND: ${TRIFLE_TRACES_STORAGE_BACKEND:-}
      TRIFLE_TRACES_STORAGE_PATH: ${TRIFLE_TRACES_STORAGE_PATH:-}
      TRIFLE_TRACES_RETENTION_DAYS: ${TRIFLE_TRACES_RETENTION_DAYS:-7}
      TRIFLE_TRACES_GZIP: ${TRIFLE_TRACES_GZIP:-true}
      TRIFLE_TRACES_MANAGE_S3_LIFECYCLE: ${TRIFLE_TRACES_MANAGE_S3_LIFECYCLE:-true}
      TRIFLE_TRACES_S3_ENDPOINT: ${TRIFLE_TRACES_S3_ENDPOINT:-}
      TRIFLE_TRACES_S3_BUCKETS: ${TRIFLE_TRACES_S3_BUCKETS:-}
      TRIFLE_TRACES_S3_REGION: ${TRIFLE_TRACES_S3_REGION:-us-east-1}
      TRIFLE_TRACES_S3_ACCESS_KEY_ID: ${TRIFLE_TRACES_S3_ACCESS_KEY_ID:-}
      TRIFLE_TRACES_S3_SECRET_ACCESS_KEY: ${TRIFLE_TRACES_S3_SECRET_ACCESS_KEY:-}
      TRIFLE_TRACES_S3_PREFIX: ${TRIFLE_TRACES_S3_PREFIX:-traces}
      
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/home/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local
