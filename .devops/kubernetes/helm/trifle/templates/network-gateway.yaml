{{- if .Values.networkGateway.enabled }}
{{- $name := include "trifle.networkGatewayName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trifle-network-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trifle-network-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: gateway
          image: "{{ .Values.networkGateway.image.repository }}:{{ .Values.networkGateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.networkGateway.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: TRIFLE_GATEWAY_STATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "trifle.networkGatewayStateSecret" . }}
                  key: state-key
            - name: TRIFLE_GATEWAY_CLIENT_CA
              value: /certs/ca.crt
            - name: TRIFLE_GATEWAY_TLS_CERT
              value: /certs/server.crt
            - name: TRIFLE_GATEWAY_TLS_KEY
              value: /certs/server.key
          ports:
            - name: gateway
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: gateway
          livenessProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.networkGateway.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ $name }}
        - name: certs
          secret:
            secretName: {{ include "trifle.networkGatewayServerSecret" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.networkGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.networkGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.networkGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trifle-network-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: gateway
      port: 8443
      targetPort: gateway
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.networkGateway.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.networkGateway.storageSize }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trifle-network-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "trifle.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8443
{{- end }}
