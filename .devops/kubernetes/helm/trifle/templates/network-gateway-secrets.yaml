{{- if .Values.networkGateway.enabled }}
{{- $gateway := .Values.networkGateway }}
{{- $external := or $gateway.stateKeySecret $gateway.serverTLSSecret $gateway.clientTLSSecret }}
{{- if $external }}
{{- if not (and $gateway.stateKeySecret $gateway.serverTLSSecret $gateway.clientTLSSecret) }}
{{- fail "Set all three networkGateway Secret names, or leave all three empty for Helm-managed credentials" }}
{{- end }}
{{- else }}
{{- $name := include "trifle.networkGatewayName" . }}
{{- $stateName := include "trifle.networkGatewayStateSecret" . }}
{{- $serverName := include "trifle.networkGatewayServerSecret" . }}
{{- $clientName := include "trifle.networkGatewayClientSecret" . }}
{{- $state := lookup "v1" "Secret" .Release.Namespace $stateName }}
{{- $server := lookup "v1" "Secret" .Release.Namespace $serverName }}
{{- $client := lookup "v1" "Secret" .Release.Namespace $clientName }}
{{- $volume := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $name }}
{{- $stateData := dict }}
{{- $serverData := dict }}
{{- $clientData := dict }}
{{- if or $state $server $client $volume }}
{{- if not (and $state $server $client) }}
{{- fail "Gateway state or credentials already exist but a Secret is missing; restore the original gateway Secrets before upgrading (do not replace the state encryption key)" }}
{{- end }}
{{- $stateData = $state.data | default (dict) }}
{{- $serverData = $server.data | default (dict) }}
{{- $clientData = $client.data | default (dict) }}
{{- $stateKey := required "Gateway state Secret is missing state-key" (index $stateData "state-key") }}
{{- if ne (len ($stateKey | b64dec | b64dec)) 32 }}
{{- fail "Gateway state-key must contain a base64-encoded 32-byte key" }}
{{- end }}
{{- range $key := list "ca.crt" "server.crt" "server.key" }}
{{- if not (index $serverData $key) }}{{ fail (printf "Gateway server Secret is missing %s" $key) }}{{ end }}
{{- end }}
{{- range $key := list "ca.crt" "client.crt" "client.key" }}
{{- if not (index $clientData $key) }}{{ fail (printf "Gateway client Secret is missing %s" $key) }}{{ end }}
{{- end }}
{{- if ne (index $serverData "ca.crt") (index $clientData "ca.crt") }}
{{- fail "Gateway server and client Secrets must share the same private CA" }}
{{- end }}
{{- else }}
{{- $ca := genCAWithKey (printf "%s-ca" $name) 3650 (genPrivateKey "ecdsa") }}
{{- $dns := list $name (printf "%s.%s" $name .Release.Namespace) (printf "%s.%s.svc" $name .Release.Namespace) }}
{{- $serverCert := genSignedCertWithKey $name nil $dns 365 $ca (genPrivateKey "ecdsa") }}
{{- $clientCert := genSignedCertWithKey (printf "%s-app" $name) nil nil 365 $ca (genPrivateKey "ecdsa") }}
{{- $stateData = dict "state-key" (randBytes 32 | b64enc) }}
{{- $serverData = dict "ca.crt" ($ca.Cert | b64enc) "server.crt" ($serverCert.Cert | b64enc) "server.key" ($serverCert.Key | b64enc) }}
{{- $clientData = dict "ca.crt" ($ca.Cert | b64enc) "client.crt" ($clientCert.Cert | b64enc) "client.key" ($clientCert.Key | b64enc) }}
{{- end }}
{{/* Keep credentials with the retained PVC; never regenerate on an upgrade. */}}
{{- range $secret := list (dict "name" $stateName "data" $stateData) (dict "name" $serverName "data" $serverData) (dict "name" $clientName "data" $clientData) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name }}
  labels:
    {{- include "trifle.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $secret.data | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
