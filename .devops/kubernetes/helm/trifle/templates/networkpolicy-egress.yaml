{{- $egress := .Values.networkPolicy.egress | default (dict) -}}
{{- if (index $egress "enabled") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trifle.fullname" . }}-egress
  labels:
    {{- include "trifle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trifle.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    # DNS, to resolver pods in any namespace.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with (index $egress "dnsCidrs") }}
    # DNS resolvers that are not pods (node-local DNS cache).
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Everything in this release: other app pods, bundled PostgreSQL, the gateway.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    # The public internet, minus private ranges.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with (index $egress "blockedCidrs") }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- range (index $egress "allowNamespaces") }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
    {{- range (index $egress "allowCidrs") }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with (index $egress "extraRules") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
