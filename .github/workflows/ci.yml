name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

jobs:
  network-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: network-gateway/go.mod
          cache-dependency-path: network-gateway/go.sum
      - name: Test network gateway
        working-directory: network-gateway
        run: go test -race ./...

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI env file
        run: |
          cp .github/ci/app.env .env.local

          TRIFLE_DB_ENCRYPTION_KEY="$(openssl rand -base64 32)"

          printf 'TRIFLE_DB_ENCRYPTION_KEY=%s\n' "${TRIFLE_DB_ENCRYPTION_KEY}" >> .env.local

          key_bytes="$(printf '%s' "${TRIFLE_DB_ENCRYPTION_KEY}" | base64 -d | wc -c | tr -d ' ')"
          if [ "${key_bytes}" -ne 32 ]; then
            echo "TRIFLE_DB_ENCRYPTION_KEY must decode to 32 bytes" >&2
            exit 1
          fi

          cp .env.local .env

      - name: Build app image
        run: docker compose build app

      - name: Start services
        run: docker compose up -d postgres mongo redis app

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U postgres -d trifle_dev; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Install Hex/Rebar
        run: |
          docker compose exec -T app mix local.hex --force
          docker compose exec -T app mix local.rebar --force

      - name: Fetch dependencies
        run: docker compose exec -T -e MIX_ENV=test app mix deps.get

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Check Helm deployments
        run: |
          docker cp "$(command -v helm)" "$(docker compose ps -q app):/tmp/helm"
          docker compose exec -T app /tmp/helm lint .devops/kubernetes/helm/trifle
          docker compose exec -T app /tmp/helm lint .devops/kubernetes/helm/trifle -f .devops/kubernetes/helm/trifle/values-saas.yaml
          docker compose exec -T -e HELM_BIN=/tmp/helm app ruby .devops/kubernetes/helm/test_network_gateway.rb
          docker compose exec -T -e HELM_BIN=/tmp/helm app elixir .devops/kubernetes/helm/test_observability.exs

      - name: Run tests
        run: docker compose exec -T -e MIX_ENV=test app mix test

      - name: Shutdown
        if: always()
        run: docker compose down -v
