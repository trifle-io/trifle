name: Build and Push Docker Images
run-name: Build and Push Docker Images (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }})

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '.devops/docker/environment/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to build and push (e.g. v0.13.2)'
        required: false
        type: string
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.devops/docker/environment/**'

env:
  REGISTRY: docker.io
  ENVIRONMENT_IMAGE_NAME: trifle/environment
  APP_IMAGE_NAME: trifle/app
  CONNECTOR_IMAGE_NAME: trifle/connector

jobs:
  build-app:
    runs-on: ubuntu-latest
    outputs:
      app_tag: ${{ steps.image_tag.outputs.version }}
      is_tag_build: ${{ steps.image_tag.outputs.is_tag_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - name: Determine image tag
        id: image_tag
        run: |
          TAG_NAME=""

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if [[ "${TAG_NAME}" == v* ]]; then
            echo "is_tag_build=true" >> "${GITHUB_OUTPUT}"
            echo "version=${TAG_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "is_tag_build=false" >> "${GITHUB_OUTPUT}"
            echo "version=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify checked out tag for manual run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        run: |
          EXPECTED_TAG="${{ github.event.inputs.tag }}"
          ACTUAL_TAG="$(git describe --tags --exact-match HEAD || true)"
          echo "Expected tag: ${EXPECTED_TAG}"
          echo "Checked out tag: ${ACTUAL_TAG:-<none>}"

          if [[ "${ACTUAL_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Expected checkout at tag ${EXPECTED_TAG}, got ${ACTUAL_TAG:-<none>}."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to Docker Hub
        if: steps.image_tag.outputs.is_tag_build == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node.js (for assets)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'

      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          elixir-version: '1.18.4'
          otp-version: '28.0'

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          echo "Building assets with MIX_ENV=prod..."
          MIX_ENV=prod mix assets.deploy
          
      - name: Verify assets were built
        run: |
          echo "Checking built assets..."
          ls -la priv/static/assets/ || echo "No assets directory found"
          echo "CSS files:"
          find priv/static -name "*.css" | head -5
          echo "JS files:"
          find priv/static -name "*.js" | head -3
          echo "All files in priv/static:"
          find priv/static -type f | head -10

      - name: Extract metadata for app image
        id: meta-app
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.APP_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image_tag.outputs.version }},enable=${{ steps.image_tag.outputs.is_tag_build == 'true' }}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ steps.image_tag.outputs.is_tag_build != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Create production Dockerfile
        run: |
          ENV_IMAGE="${{ env.ENVIRONMENT_IMAGE_NAME }}:ruby_3.2.0-erlang_28.0.2-elixir_1.18.4"
          
          cat > Dockerfile.production << EOF
          # Production Dockerfile for Trifle (Generated by GitHub Actions)
          FROM ${ENV_IMAGE} AS builder
          
          # Set build environment
          ENV MIX_ENV=prod
          
          WORKDIR /app
          
          # Copy mix files and install dependencies
          COPY mix.exs mix.lock ./
          RUN mix deps.get --only prod
          
          # Copy application source code (with pre-built assets)
          COPY . .
          
          # Compile and create release (assets already built)
          RUN mix compile
          RUN mix release
          
          # Production stage
          FROM debian:sid-slim AS runtime
          
          # Install runtime dependencies including Chromium for server-side export
          RUN apt-get update -y && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libstdc++6 \
                openssl \
                libncurses6 \
                ca-certificates \
                curl \
                chromium \
                libgbm1 \
                libnss3 \
                fonts-liberation \
                fonts-noto \
                fonts-noto-color-emoji \
              && apt-get clean && \
              rm -rf /var/lib/apt/lists/*
          
          # Create app user
          RUN useradd --create-home --shell /bin/bash app
          USER app
          WORKDIR /home/app
          
          # Copy the built release from builder stage
          COPY --from=builder --chown=app:app /app/_build/prod/rel/trifle ./
          
          # Set environment variables
          ENV MIX_ENV=prod
          ENV PHX_SERVER=true
          ENV LANG=en_US.UTF-8
          ENV LC_ALL=en_US.UTF-8
          ENV ELIXIR_ERL_OPTIONS=+fnu
          # Explicitly set Chromium path for exporter
          ENV CHROME_PATH=/usr/bin/chromium
          
          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
              CMD curl -f http://localhost:4000/api/health || exit 1
          
          # Expose port
          EXPOSE 4000
          
          # Start the application
          CMD ["./bin/trifle", "start"]
          EOF

      - name: Build and push app image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: ./Dockerfile.production
          platforms: linux/amd64
          push: ${{ steps.image_tag.outputs.is_tag_build == 'true' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set build date
        id: build_date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Extract metadata for connector image
        id: meta-connector
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.CONNECTOR_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image_tag.outputs.version }},enable=${{ steps.image_tag.outputs.is_tag_build == 'true' }}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ steps.image_tag.outputs.is_tag_build != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push connector image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: connector
          file: ./.devops/docker/connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image_tag.outputs.is_tag_build == 'true' }}
          tags: ${{ steps.meta-connector.outputs.tags }}
          labels: ${{ steps.meta-connector.outputs.labels }}
          build-args: |
            VERSION=${{ steps.image_tag.outputs.version != '' && steps.image_tag.outputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    if: needs.build-app.outputs.is_tag_build == 'true'
    needs: [build-app]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98
        with:
          image-ref: '${{ env.APP_IMAGE_NAME }}:${{ needs.build-app.outputs.app_tag }}'
          format: 'table'
          output: 'trivy-results.txt'
          skip-version-check: true

      - name: Run Trivy vulnerability scanner for connector
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98
        with:
          image-ref: '${{ env.CONNECTOR_IMAGE_NAME }}:${{ needs.build-app.outputs.app_tag }}'
          format: 'table'
          output: 'trivy-connector-results.txt'
          skip-version-check: true

      - name: Display security scan results
        if: always()
        run: |
          echo "🛡️ Security Scan Results:"
          echo "========================="
          if [ -f trivy-results.txt ]; then
            echo "Application image:"
            cat trivy-results.txt
          else
            echo "No application scan results found"
          fi
          if [ -f trivy-connector-results.txt ]; then
            echo ""
            echo "Connector image:"
            cat trivy-connector-results.txt
          else
            echo "No connector scan results found"
          fi

      - name: Run Trivy vulnerability scanner (SARIF format for GitHub Security)
        if: false  # Disabled for now - requires GitHub Advanced Security
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98
        with:
          image-ref: '${{ env.APP_IMAGE_NAME }}:${{ needs.build-app.outputs.app_tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          skip-version-check: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: false  # Disabled for now - requires GitHub Advanced Security  
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for critical vulnerabilities
        if: always()
        run: |
          SCAN_FILES=""
          if [ -f trivy-results.txt ]; then
            SCAN_FILES="${SCAN_FILES} trivy-results.txt"
          fi
          if [ -f trivy-connector-results.txt ]; then
            SCAN_FILES="${SCAN_FILES} trivy-connector-results.txt"
          fi

          if [ -n "${SCAN_FILES}" ]; then
            if grep -q "CRITICAL" ${SCAN_FILES}; then
              echo "⚠️  CRITICAL vulnerabilities found!"
              echo "Please review the security scan results above."
              echo "Continuing build - review and fix vulnerabilities in production."
              # Don't fail the build for now - just warn
              # exit 1
            else
              echo "✅ No critical vulnerabilities found."
            fi
          fi
